<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title></title> <!-- Set by JS -->
  <style>
    body {
      width: 350px;
      padding: 15px;
      font-family: sans-serif;
      font-size: 14px;
    }
    h2 {
      margin-top: 0;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }
    .setting-item {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="password"], input[type="number"] {
      width: 95%;
      padding: 5px;
    }
    textarea {
      width: 95%;
      padding: 5px;
      font-family: monospace;
    }
    button {
      padding: 8px 12px;
      border: 1px solid #ccc;
      background-color: #f0f0f0;
      cursor: pointer;
    }
    button:hover {
      background-color: #e0e0e0;
    }
    #save-button {
      background-color: #4CAF50;
      color: white;
      border: none;
    }
    #message-area {
      color: #D8000C;
      background-color: #FFD2D2;
      margin-bottom: 15px;
      border: 1px solid #D8000C;
      padding: 10px;
      border-radius: 3px;
      display: none;
    }
    #prompt-display-area pre {
      background-color: #f4f4f4;
      padding: 10px;
      border-radius: 3px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 12px;
      max-height: 150px;
      overflow-y: auto;
    }
    .button-group {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    .info-section {
      margin-top: 20px;
      padding-top: 10px;
      border-top: 1px solid #ccc;
      font-size: 12px;
      color: #666;
    }
    .info-section a {
        color: #007bff;
        text-decoration: none;
    }
    .info-section a:hover {
        text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="message-area"></div>

  <h2 data-i18n="popupHeader"></h2>

  <div class="setting-item">
    <label for="api-key-input" data-i18n="apiKeyLabel"></label>
    <input type="password" id="api-key-input">
  </div>

  <div class="setting-item">
    <label data-i18n="systemPromptLabel"></label>
    <p style="font-size:12px; color:#666; margin-top:0;" data-i18n="systemPromptDescription"></p>
    <div id="prompt-display-area">
      <pre id="prompt-display-content"></pre>
      <button id="edit-prompt-button" data-i18n="editButtonText"></button>
    </div>
    <div id="prompt-edit-area" style="display: none;">
      <textarea id="system-prompt-input" rows="12"></textarea>
      <div class="button-group">
        <button id="reset-prompt-button" data-i18n="resetButtonText"></button>
      </div>
    </div>
  </div>

  <div class="setting-item">
    <label for="pdf-page-count-input" data-i18n="pageCountLabel"></label>
    <p style="font-size:12px; color:#666; margin-top:0;" data-i18n="pageCountDescription"></p>
    <input type="number" id="pdf-page-count-input" value="1" min="1">
  </div>

  <button id="save-button" data-i18n="saveButtonText"></button>

  <div class="info-section">
    <p>
      <span data-i18n-html="feedbackText"></span>
    </p>
    <p data-i18n="optionsPageInstruction"></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
